="-5.13" x="153.0868787002616" y="422.7894809307449" width="29.257882417733725" height="17.210519069255156" fill="rgba(20, 184, 166, 0.55)" stroke="#0f766e" stroke-width="0.029051999999999994"/></g><g><rect data-type="rect" data-label="IO" data-x="0.7" data-y="-5.13" x="249.46578548809032" y="422.7894809307449" width="29.257882417733754" height="17.210519069255156" fill="rgba(20, 184, 166, 0.55)" stroke="#0f766e" stroke-width="0.029051999999999994"/></g><g><rect data-type="rect" data-label="IO" data-x="-5.13" data-y="2.1" x="54.81481481481478" y="167.90169351507637" width="17.210519069255156" height="29.257882417733725" fill="rgba(20, 184, 166, 0.55)" stroke="#0f766e" stroke-width="0.029051999999999994"/></g><g><rect data-type="rect" data-label="IO" data-x="2.1" data-y="5.13" x="297.6552388820047" y="69.62962962962959" width="29.257882417733697" height="17.210519069255156" fill="rgba(20, 184, 166, 0.55)" stroke="#0f766e" stroke-width="0.029051999999999994"/></g><g><rect data-type="rect" data-label="IO" data-x="5.13" data-y="-2.1" x="407.97466611593006" y="312.4700536968195" width="17.210519069255156" height="29.257882417733754" fill="rgba(20, 184, 166, 0.55)" stroke="#0f766e" stroke-width="0.029051999999999994"/></g><g><rect data-type="rect" data-label="IO" data-x="0.7" data-y="5.13" x="249.46578548809032" y="69.62962962962959" width="29.257882417733754" height="17.210519069255156" fill="rgba(20, 184, 166, 0.55)" stroke="#0f766e" stroke-width="0.029051999999999994"/></g><g><rect data-type="rect" data-label="IO" data-x="-5.13" data-y="-2.1" x="54.81481481481478" y="312.4700536968195" width="17.210519069255156" height="29.257882417733754" fill="rgba(20, 184, 166, 0.55)" stroke="#0f766e" stroke-width="0.029051999999999994"/></g><g><rect data-type="rect" data-label="PASSIVE" data-x="-0.20399999999999996" data-y="-1.475" x="219.2096929643398" y="289.2358529533251" width="27.536830510808215" height="32.69998623158472" fill="rgba(245, 158, 11, 0.72)" stroke="#92400e" stroke-width="0.029051999999999994"/></g><g><rect data-type="rect" data-label="PASSIVE" data-x="1.446" data-y="-1.475" x="276.0044058928818" y="289.2358529533251" width="27.536830510808215" height="32.69998623158472" fill="rgba(245, 158, 11, 0.72)" stroke="#92400e" stroke-width="0.029051999999999994"/></g><g><rect data-type="rect" data-label="PASSIVE" data-x="-2.6535" data-y="1.955" x="131.0229932534765" y="163.42695855707007" width="35.281564091973024" height="48.18945339391436" fill="rgba(245, 158, 11, 0.72)" stroke="#92400e" stroke-width="0.029051999999999994"/></g><g><rect data-type="rect" data-label="PASSIVE" data-x="-0.8285000000000001" data-y="1.955" x="193.8413878562577" y="163.42695855707007" width="35.281564091973024" height="48.18945339391436" fill="rgba(245, 158, 11, 0.72)" stroke="#92400e" stroke-width="0.029051999999999994"/></g><text data-type="text" data-label="BGA bottom / passives top" data-x="0" data-y="6.2408" x="240" y="39.99999999999997" fill="#334155" font-size="20.370370370370374" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">BGA bottom / passives top</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="480" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="480" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '480');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '480');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":34.42103813851026,"c":0,"e":240,"b":0,"d":-34.42103813851026,"f":254.8148148148148};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>