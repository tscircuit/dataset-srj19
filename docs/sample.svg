92565056" cy="533.8289962825279" r="3" fill="black"/></g><g><circle data-type="point" data-label="bga_conn_006 pcb_port_41" data-x="0.7" data-y="5.13" cx="646.8401486988847" cy="56.72862453531593" r="3" fill="black"/></g><g><circle data-type="point" data-label="bga_conn_007 pcb_port_35" data-x="-2" data-y="-2" cx="466.1710037174721" cy="533.8289962825279" r="3" fill="black"/></g><g><circle data-type="point" data-label="bga_conn_007 pcb_port_42" data-x="-5.13" data-y="-2.1" cx="256.72862453531593" cy="540.5204460966543" r="3" fill="black"/></g><g><circle data-type="point" data-label="passive_conn_008 pcb_port_27" data-x="-0.4" data-y="-1.2" cx="573.2342007434944" cy="480.29739776951675" r="3" fill="black"/></g><g><circle data-type="point" data-label="passive_conn_008 pcb_port_43" data-x="-0.20399999999999996" data-y="-1.475" cx="586.3494423791822" cy="498.69888475836433" r="3" fill="black"/></g><g><circle data-type="point" data-label="passive_conn_009 pcb_port_44" data-x="1.446" data-y="-1.475" cx="696.7583643122676" cy="498.69888475836433" r="3" fill="black"/></g><g><circle data-type="point" data-label="passive_conn_009 pcb_port_40" data-x="5.13" data-y="-2.1" cx="943.2713754646841" cy="540.5204460966543" r="3" fill="black"/></g><g><circle data-type="point" data-label="passive_conn_010 pcb_port_1" data-x="1.2" data-y="2" cx="680.2973977695167" cy="266.1710037174721" r="3" fill="black"/></g><g><circle data-type="point" data-label="passive_conn_010 pcb_port_45" data-x="-2.6535" data-y="1.955" cx="422.44237918215606" cy="269.182156133829" r="3" fill="black"/></g><g><circle data-type="point" data-label="passive_conn_011 pcb_port_46" data-x="-0.8285000000000001" data-y="1.955" cx="544.5613382899628" cy="269.182156133829" r="3" fill="black"/></g><g><circle data-type="point" data-label="passive_conn_011 pcb_port_41" data-x="0.7" data-y="5.13" cx="646.8401486988847" cy="56.72862453531593" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":66.91449814126395,"c":0,"e":600,"b":0,"d":-66.91449814126395,"f":400};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>